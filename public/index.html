<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>a minecraft clone</title>
    <script>
      (function () {
        var domain = "mc.trebeljahr.com";
        if (location.hostname !== domain) return;
        window.plausible =
          window.plausible ||
          function () {
            (window.plausible.q = window.plausible.q || []).push(arguments);
          };
        var script = document.createElement("script");
        script.defer = true;
        script.dataset.domain = domain;
        script.src =
          "https://plausible.trebeljahr.com/js/script.file-downloads.hash.outbound-links.pageview-props.revenue.tagged-events.js";
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="crosshairContainer"><div id="crosshair"></div></div>
    <div id="inventoryScreenContainer">
      <div id="inventoryElement"></div>
    </div>
    <div id="hotbarContainerElement">
      <div id="hotbarElement"></div>
    </div>
    <div id="menu">
      <div id="loadingScreen">
        <h2>Loading...</h2>
      </div>
      <div id="menuScreen">
        <h2 id="menuTitle">a minecraft clone</h2>
        <div id="menuButtons">
          <div id="worldLoaderState">
            <span id="worldLoaderText">Generating geometry...</span>
            <div id="progressBarContainer">
              <div id="progressBar"></div>
            </div>
          </div>
          <button type="button" disabled id="playButton" class="menuButton">Play</button>
          <button type="button" id="optionsButton" class="menuButton">Options</button>
          <button type="button" id="controlsButton" class="menuButton">Controls</button>
        </div>
      </div>

      <div id="optionsScreen">
        <h2 id="optionsTitle">Options</h2>
        <div id="optionsButtons">
          <button type="button" id="optionsBackButton" class="menuButton">Back</button>
        </div>
      </div>

      <div id="controlsScreen">
        <h2 id="controlsTitle">Controls</h2>

        <div id="controlsButtons">
          <button type="button" id="controlsBackButton" class="menuButton">Back</button>
        </div>
      </div>
    </div>

    <script type="text/javascript" src="/dist/main.js"></script>
  </body>
</html>
